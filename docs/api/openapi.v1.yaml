        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/admin/dentists/{id}/verify-email:
    post:
      tags: [Admin]
      summary: Mark a dentist email as verified
      operationId: adminVerifyDentistEmail
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Updated dentist account
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v1/admin/dentists/{id}/restore:
    post:
      tags: [Admin]
      summary: Restore a deleted dentist account
      operationId: adminRestoreDentist
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"

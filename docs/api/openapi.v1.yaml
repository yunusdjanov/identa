              allOf:
                - $ref: "#/components/schemas/AnalyticsKpiOptionalPrevious"
                - type: object
                  properties:
                    currency:
                      type: string
                    totals_by_currency:
                      type: array
                      items:
                        type: object
                        properties:
                          currency:

openapi: 3.1.0
info:
  title: Identa API
  version: 1.0.0
  description: |
    OpenAPI contract for the current Laravel backend integration.
    This contract is authoritative for frontend/backend alignment.
servers:
  - url: http://localhost:8000
    description: Local backend
tags:
  - name: Health
  - name: Auth
  - name: Patients
  - name: Appointments
  - name: Payments
  - name: Analytics
  - name: Lookups
  - name: Settings
  - name: Admin
paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: API healthcheck
      operationId: getHealth
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: backend
                  timestamp:
                    type: string
                    format: date-time
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login and create session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/auth/csrf-token:
    get:
      tags: [Auth]
      summary: Initialize or read the current browser CSRF token
      operationId: getCsrfToken
      responses:
        "200":
          description: Current session CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register an unverified dentist and start the trial
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Dentist registered and browser session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/auth/google:
    post:
      tags: [Auth]
      summary: Sign in or register with a verified Google ID token
      operationId: googleLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleAuthRequest"
      responses:
        "200":
          description: Google authentication completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout and revoke session
      operationId: logout
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a mobile refresh token and return a new bearer token pair
      operationId: refreshMobileToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Token pair refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Send password reset link
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Reset link sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      operationId: getMe
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Change the current user's password and revoke other sessions
      operationId: changePassword
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/auth/email/verification-notification:
    post:
      tags: [Auth]
      summary: Resend the verification email for the current user
      operationId: resendEmailVerification
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current verification state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailVerificationNotificationResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/auth/email/verify/{id}/{hash}:
    get:
      tags: [Auth]
      summary: Verify an email through a time-limited signed URL
      operationId: verifyEmail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: hash
          in: path
          required: true
          schema:
            type: string
        - name: expires
          in: query
          required: true
          schema:
            type: integer
        - name: signature
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirects to the public verification result page
        "403":
          description: Invalid, expired, or unsigned verification URL
  /api/v1/auth/google/link:
    post:
      tags: [Auth]
      summary: Link a verified Google identity to the current account
      operationId: linkGoogleAccount
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleAuthRequest"
      responses:
        "200":
          description: Google identity linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Auth]
      summary: Unlink Google while retaining password sign-in
      operationId: unlinkGoogleAccount
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Google identity unlinked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/lookups/patients:
    get:
      tags: [Lookups]
      summary: Search lightweight patients for appointment/payment selectors
      operationId: lookupPatients
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/SearchFilter"
      responses:
        "200":
          description: Paginated patient lookup rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientLookupCollectionResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/patient-categories:
    get:
      tags: [Patients]
      summary: List dentist-owned patient categories
      operationId: listPatientCategories
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Patient categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientCategoryCollectionResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
    post:
      tags: [Patients]
      summary: Create a patient category
      operationId: createPatientCategory
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientCategoryUpsertRequest"
      responses:
        "201":
          description: Patient category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientCategoryResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/patient-categories/{id}:
    put:
      tags: [Patients]
      summary: Update a patient category
      operationId: updatePatientCategory
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientCategoryUpsertRequest"
      responses:
        "200":
          description: Patient category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientCategoryResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Patients]
      summary: Delete a patient category and detach it from patients
      operationId: deletePatientCategory
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Patient category deleted
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v1/patients:
    get:
      tags: [Patients]
      summary: List dentist-owned patients
      operationId: listPatients
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/SearchFilter"
        - $ref: "#/components/parameters/PatientCategoryFilter"
        - $ref: "#/components/parameters/PatientCategoryIdsFilter"
        - $ref: "#/components/parameters/PatientInactiveBeforeFilter"
        - $ref: "#/components/parameters/PatientArchivedOnlyFilter"
        - $ref: "#/components/parameters/PatientIncludeArchivedFilter"
      responses:
        "200":
          description: Paginated patients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientCollectionResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Patients]
      summary: Create patient
      operationId: createPatient
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientUpsertRequest"
      responses:
        "201":
          description: Patient created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/patients/recent:
    get:
      tags: [Patients]
      summary: List profile-scoped recently opened patients
      operationId: listRecentPatients
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Recent patients for the current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentPatientCollectionResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
    delete:
      tags: [Patients]
      summary: Clear profile-scoped recent patients
      operationId: clearRecentPatients
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Recent patients cleared
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
  /api/v1/patients/recent/{id}:
    post:
      tags: [Patients]
      summary: Remember one profile-scoped recent patient
      operationId: rememberRecentPatient
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Recent patient remembered
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags: [Patients]
      summary: Remove one profile-scoped recent patient
      operationId: forgetRecentPatient
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Recent patient removed
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
  /api/v1/patients/{id}:
    get:
      tags: [Patients]
      summary: Get patient detail
      operationId: getPatient
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Patient detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    put:
      tags: [Patients]
      summary: Update patient
      operationId: updatePatient
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientUpsertRequest"
      responses:
        "200":
          description: Patient updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags: [Patients]
      summary: Delete patient
      operationId: deletePatient
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Patient deleted
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v1/patients/{id}/overview:
    get:
      tags: [Patients]
      summary: Get permission-filtered patient summary metrics
      operationId: getPatientOverview
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Patient overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientOverviewResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v1/patients/{id}/restore:
    post:
      tags: [Patients]
      summary: Restore an archived patient
      operationId: restorePatient
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Patient restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v1/patients/{id}/force:
    delete:
      tags: [Patients]
      summary: Permanently delete an archived patient and related records
      operationId: permanentlyDeletePatient
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Patient permanently deleted
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/patients/{id}/photo:
    get:
      tags: [Patients]
      summary: Download the approved patient profile photo
      operationId: downloadPatientPhoto
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Approved image bytes
        "404":
          $ref: "#/components/responses/NotFoundError"
    post:
      tags: [Patients]
      summary: Upload or safely replace a patient profile photo
      operationId: uploadPatientPhoto
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PhotoMultipartRequest"
      responses:
        "200":
          description: Patient updated and media scan queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Patients]
      summary: Delete the patient profile photo
      operationId: deletePatientPhoto
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Patient photo deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResponse"
  /api/v1/patients/{id}/photo/direct-upload:
    post:
      tags: [Patients]
      summary: Prepare a direct upload for a patient profile photo
      operationId: preparePatientPhotoDirectUpload
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectUploadPrepareRequest"
      responses:
        "200":
          description: Signed upload ticket, or unsupported=false when the disk cannot sign uploads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectUploadPrepareResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/patients/{id}/photo/direct-upload/{uploadId}/complete:
    post:
      tags: [Patients]
      summary: Finalize a direct-uploaded patient profile photo
      operationId: finalizePatientPhotoDirectUpload
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: Patient updated and media scan queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/patients/{id}/oral-photo/direct-upload:
    post:
      tags: [Patients]
      summary: Prepare a legacy smile oral-photo direct upload
      operationId: prepareLegacyOralPhotoDirectUpload
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectUploadPrepareRequest"
      responses:
        "200":
          description: Signed upload ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectUploadPrepareResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/patients/{id}/oral-photo/direct-upload/{uploadId}/complete:
    post:
      tags: [Patients]
      summary: Finalize a legacy smile oral-photo direct upload
      operationId: finalizeLegacyOralPhotoDirectUpload
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: Patient updated and media scan completed/queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/patients/{id}/oral-photos/{viewType}:
    get:
      tags: [Patients]
      summary: Download the primary approved oral photo for a clinical view
      operationId: downloadPrimaryOralPhoto
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/OralPhotoViewType"
      responses:
        "200":
          description: Approved image bytes
        "404":
          $ref: "#/components/responses/NotFoundError"
    post:
      tags: [Patients]
      summary: Upload an oral photo for a clinical view
      operationId: uploadOralPhoto
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/OralPhotoViewType"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PhotoMultipartRequest"
      responses:
        "200":
          description: Patient updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Patients]
      summary: Delete all oral photos for a clinical view
      operationId: deleteOralPhotoView
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/OralPhotoViewType"
      responses:
        "200":
          description: Patient updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResponse"
  /api/v1/patients/{id}/oral-photos/{viewType}/{photoId}:
    get:
      tags: [Patients]
      summary: Download one approved oral photo
      operationId: downloadOralPhotoItem
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/OralPhotoViewType"
        - name: photoId

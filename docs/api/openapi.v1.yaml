          type: array
          description: Top 4 patients by outstanding balance for the selected analytics range.
          maxItems: 4
          items:
            $ref: "#/components/schemas/AnalyticsTopDebtor"
      required: [currency, permissions, kpis, buckets, appointment_status, top_debtors]

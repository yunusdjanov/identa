        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/SearchFilter"
      responses:
        "200":
          description: Paginated admin payment ledger
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
  /api/v1/admin/payments/{id}/refund:
    post:
      tags: [Admin, Billing]
      summary: Mark an externally refunded payment as refunded
      description: Identa does not initiate the provider or bank refund. The money must be returned externally first.
      operationId: adminMarkPaymentRefunded
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Payment marked refunded
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

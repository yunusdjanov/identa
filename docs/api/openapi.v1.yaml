          $ref: "#/components/responses/ValidationError"
  /api/v1/admin/plans:
    get:
      tags: [Admin, Billing]
      summary: List subscription plans
      operationId: adminListPlans
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Subscription plan collection
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
  /api/v1/admin/plans/{code}:
    put:
      tags: [Admin, Billing]
      summary: Update a subscription plan
      operationId: adminUpdatePlan
      security:
        - cookieAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            enum: [trial, basic, pro]
      responses:
        "200":
          description: Updated subscription plan
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/admin/dentists/{id}:
    get:
      tags: [Admin]
      summary: Get a dentist account
      operationId: adminGetDentist
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Dentist account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDentistResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags: [Admin]
      summary: Delete dentist account (admin only)
      operationId: adminDeleteDentist
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Dentist account marked as deleted
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: laravel_session
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TreatmentId:
      name: treatmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OralPhotoViewType:
      name: viewType
      in: path
      required: true
      schema:
        type: string
        enum: [smile, top, bottom]
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
    Sort:
      name: sort
      in: query
      description: Comma separated fields, prefix with '-' for desc (e.g. -created_at)
      schema:
        type: string
        example: -created_at
    SearchFilter:
      name: filter[search]
      in: query
      schema:
        type: string
        maxLength: 160
    PaymentSearchFilter:
      name: filter[search]
      in: query
      schema:
        type: string
        maxLength: 160
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Reuse the same key to safely retry an expense creation request.
      schema:
        type: string
        maxLength: 100
        pattern: "^[A-Za-z0-9._:-]+$"
    PatientIdFilter:
      name: filter[patient_id]
      in: query
      schema:
        type: string
        format: uuid
    PatientCategoryFilter:
      name: filter[category_id]
      in: query
      schema:
        type: string
        format: uuid
    PatientCategoryIdsFilter:
      name: filter[category_ids]
      in: query
      description: Comma-separated UUIDs or repeated query-array values; at most 50 categories
      schema:
        oneOf:
          - type: string
          - type: array
            maxItems: 50
            items:
              type: string
              format: uuid
    PatientInactiveBeforeFilter:
      name: filter[inactive_before]
      in: query
      schema:
        type: string
        format: date
    PatientArchivedOnlyFilter:
      name: filter[archived_only]
      in: query
      schema:
        type: boolean
    PatientIncludeArchivedFilter:
      name: filter[include_archived]
      in: query
      schema:
        type: boolean
    DateFromFilter:
      name: filter[date_from]
      in: query
      schema:
        type: string
        format: date
    DateToFilter:
      name: filter[date_to]
      in: query
      schema:
        type: string
        format: date
    StatusFilter:
      name: filter[status]
      in: query
      schema:
        type: string
    AccountStatusFilter:
      name: filter[status]
      in: query
      schema:
        type: string
        enum: [active, blocked, deleted]
    OutstandingFilter:
      name: filter[outstanding]
      in: query
      schema:
        type: boolean
    IncludePatientPhoto:
      name: include_patient_photo
      in: query
      description: Include protected patient photo state and media URLs in ledger rows.
      schema:
        type: boolean
        default: false
    IncludeSummary:
      name: include_summary
      in: query
      description: Set to false for table-only requests to skip aggregate summary queries.
      schema:
        type: boolean
        default: true
  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    EnvelopeMeta:
      type: object
      properties:
        request_id:
          type: string
          example: req_01JY2SPWJ5CFVQ68C7W6A41Q6N
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: validation_failed
            message:
              type: string
              example: Validation failed.
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
        meta:
          $ref: "#/components/schemas/EnvelopeMeta"
      required: [error]
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    PaymentLedgerSummary:
      type: object
      properties:
        total_debt:
          type: number
        total_paid:
          type: number
        total_balance:
          type: number
        outstanding_count:
          type: integer
        total_entries:
          type: integer
        total_patients:
          type: integer
        totals_by_currency:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PaymentLedgerCurrencyTotals"
    PaymentLedgerCurrencyTotals:
      type: object
      properties:
        total_debt:
          type: number
        total_paid:
          type: number
        total_balance:
          type: number
    PaymentLedgerCurrencyBalance:
      type: object
      properties:
        total_debt:
          type: number
        total_paid:
          type: number
        balance:
          type: number
    ActorSummary:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
    PatientLookup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patient_id:
          type: string
        full_name:
          type: string
        phone:
          type: string
        secondary_phone:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
    RecentPatient:
      type: object
      required: [id, full_name]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
    MediaImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          nullable: true
        editor_url:
          type: string
          nullable: true
          description: Same-origin authenticated full-resolution URL for canvas editing
        thumbnail_url:
          type: string
          nullable: true
        preview_url:
          type: string
          nullable: true
        scan_status:
          type: string
          enum: [pending, approved, rejected]
        sort_order:
          type: integer
          nullable: true
        view_type:
          type: string
          nullable: true
        mime_type:
          type: string
          nullable: true
        file_size:
          type: integer
    PhotoMultipartRequest:
      type: object
      required: [photo]
      properties:
        photo:
          type: string
          format: binary
          description: JPEG, PNG, or WebP up to the configured platform and plan ceilings
    ImageMultipartRequest:
      type: object
      required: [image]
      properties:
        image:
          type: string
          format: binary
          description: JPEG, PNG, or WebP up to the configured platform and plan ceilings
    DirectUploadPrepareRequest:
      type: object
      required: [filename, content_type, file_size]
      properties:
        filename:
          type: string
          maxLength: 255
        content_type:
          type: string
          enum: [image/jpeg, image/jpg, image/png, image/webp]
        file_size:
          type: integer
          minimum: 1
          maximum: 20971520
          description: Default platform ceiling is 20 MiB; deployment configuration may lower it
    DirectUploadTicket:
      type: object
      properties:
        upload_id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        method:
          type: string
          example: PUT
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
    DirectUploadPrepareResponse:
      type: object
      properties:
        data:
          allOf:
            - $ref: "#/components/schemas/DirectUploadTicket"
            - type: object
              properties:
                supported:
                  type: boolean
                  default: true
      required: [data]
    DirectUploadBatchPrepareRequest:
      type: object
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 10
          items:
            allOf:
              - $ref: "#/components/schemas/DirectUploadPrepareRequest"
              - type: object
                required: [client_id]
                properties:
                  client_id:
                    type: string
                    maxLength: 80
    DirectUploadBatchPrepareResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            uploads:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/DirectUploadTicket"
                  - type: object
                    properties:
                      client_id:
                        type: string
            failed:
              type: array
              items:
                type: object
                properties:
                  client_id:
                    type: string
                  message:
                    type: string
      required: [data]
    DirectUploadBatchCompleteRequest:
      type: object
      required: [upload_ids]
      properties:
        upload_ids:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: uuid
    DirectUploadBatchCompleteResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            completed_count:
              type: integer
            failed:
              type: array
              items:
                type: object
      required: [data]
    AdminDentistCollectionSummary:
      type: object
      properties:
        total_count:
          type: integer
        active_count:
          type: integer
        new_registrations_7d:
          type: integer
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, dentist]
        account_status:
          type: string
          enum: [active, blocked, deleted]
    AdminDentistAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        practice_name:
          type: string
          nullable: true
        registration_date:
          type: string
          format: date
        status:
          type: string
          enum: [active, blocked, deleted]
        last_login:
          type: string
          format: date-time
          nullable: true
        patient_count:
          type: integer
        appointment_count:
          type: integer
    Patient:
      type: object
      required: [id, patient_id, full_name, phone, is_archived, categories]
      properties:
        id:
          type: string
          format: uuid
        patient_id:
          type: string
          pattern: "^PT-[0-9]{4}[A-Z]{2}$"
          example: PT-4851VS
        full_name:
          type: string
        phone:
          type: string
        secondary_phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum: [male, female]
          nullable: true
        medical_history:
          type: string
          nullable: true
        allergies:
          type: string
          nullable: true
        current_medications:
          type: string
          nullable: true
        photo_scan_status:
          type: string
          enum: [pending, approved, rejected]
          nullable: true
          description: Status used to gate the currently displayable photo
        photo_processing_status:
          type: string
          enum: [pending, approved, rejected]
          nullable: true
          description: Lifecycle status of the latest upload or replacement attempt
        photo_url:
          type: string
          nullable: true
        photo_thumbnail_url:
          type: string
          nullable: true
        photo_preview_url:
          type: string
          nullable: true
        photo_thumbnail_ready:
          type: boolean
        photo_preview_ready:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true
        last_visit_at:
          type: string
          format: date
          nullable: true
        is_archived:
          type: boolean
        archived_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          $ref: "#/components/schemas/ActorSummary"
        updated_by:
          $ref: "#/components/schemas/ActorSummary"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/PatientCategory"
        oral_photo:
          allOf:
            - $ref: "#/components/schemas/PatientClinicalPhoto"
          nullable: true
        oral_photos:
          $ref: "#/components/schemas/PatientClinicalPhotoSlots"
        oral_photo_galleries:
          $ref: "#/components/schemas/PatientClinicalPhotoGalleries"
    PatientCategory:
      type: object
      required: [id, name, color, sort_order]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
        sort_order:
          type: integer
    PatientClinicalPhoto:
      type: object
      required: [id, view_type, is_primary, sort_order]
      properties:
        id:
          type: string
          format: uuid
        view_type:
          type: string
          enum: [smile, top, bottom]
        scan_status:
          type: string
          enum: [pending, approved, rejected]
          nullable: true
        url:
          type: string
          nullable: true
        thumbnail_url:
          type: string
          nullable: true
        preview_url:
          type: string
          nullable: true
        thumbnail_ready:
          type: boolean
        preview_ready:
          type: boolean
        is_primary:
          type: boolean
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    PatientClinicalPhotoSlots:
      type: object
      properties:

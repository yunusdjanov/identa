          type: object
          properties:
            payments:
              type: boolean
            patients:
              type: boolean
            appointments:
              type: boolean
          required: [payments, patients, appointments]
        kpis:
          type: object
          properties:
            revenue:
              $ref: "#/components/schemas/AnalyticsKpiPair"
            debt:
              $ref: "#/components/schemas/AnalyticsKpiOptionalPrevious"

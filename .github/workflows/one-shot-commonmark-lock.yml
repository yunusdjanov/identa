name: One-shot CommonMark lock update

on:
  push:
    branches:
      - docs/s05-media-audit-closeout

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: docs/s05-media-audit-closeout
          fetch-depth: 0

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          tools: composer:2.10.3
          coverage: none

      - name: Update and verify Composer lock
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          composer update league/commonmark \
            --with-all-dependencies \
            --minimal-changes \
            --no-install \
            --no-scripts \
            --no-plugins \
            --no-interaction \
            --no-progress
          composer validate --no-check-publish
          composer audit --locked --no-interaction
          cd ..

          mapfile -t changed < <(git diff --name-only)
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "backend/composer.lock" ]]; then
            printf 'Unexpected files changed:\n'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi
          git diff --check

      - name: Commit lock update and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-commonmark-lock.yml
          git add backend/composer.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: update commonmark security patch"
          git push origin "HEAD:docs/s05-media-audit-closeout"
